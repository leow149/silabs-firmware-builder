name: ZBDongle-E OpenThread RCP
device: EFR32MG21A020F768IM32
base_project: src/openthread_rcp
filename: "{manifest_name}_{ot_rcp_version.split('/')[-1]}_gsdk_{sdk_version}"
sdk: "simplicity_sdk:2026.6.2"
toolchain: "14.2.1.20241119"

gbl:
  fw_type: openthread_rcp
  ot_rcp_version: dynamic
  baudrate: 460800

sdk_patches:
  - disable_gp_rx_filter.patch
  - uart_tx_drop_on_timeout.patch
  - uart_tx_bounded_wait_usart.patch

add_components:
  - id: iostream_usart
    instance: [vcom]

c_defines:
  OPENTHREAD_CONFIG_NCP_TX_BUFFER_SIZE:
    type: c_flag
    value: 4096

  # ZBDongle-E: 38.4 MHz crystal, CTUNE 128 (BRD4180B default is 129)
  SL_CLOCK_MANAGER_HFXO_FREQ: 38400000
  SL_CLOCK_MANAGER_HFXO_CTUNE: 128

  # USART0 on PB1/PB0, no hardware flow control
  SL_IOSTREAM_USART_VCOM_PERIPHERAL: USART0
  SL_IOSTREAM_USART_VCOM_PERIPHERAL_NO: 0
  SL_IOSTREAM_USART_VCOM_BAUDRATE: 460800
  SL_IOSTREAM_USART_VCOM_TX_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_USART_VCOM_TX_PIN: 1
  SL_IOSTREAM_USART_VCOM_RX_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_USART_VCOM_RX_PIN: 0
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlNone
